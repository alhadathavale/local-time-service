server.port=${PORT:8080}

# MySQL DataSource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/app_time?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:spring_app}
spring.datasource.password=${DB_PASSWORD:abcd@1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql and data.sql on every startup
spring.sql.init.mode=always

# Let SQL scripts run before JPA maps entities to tables
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
